Test:
  chapter: 02.2.4
  jira_issue: ''
  name: Двоичные типы данных
  caption: Передача PL/SQL-содержимого в SQL-запрос в бинд-переменные
  comment: ''
  cases:
  - id: 1
    caption: Проверка корректности использования бинд-переменных в базовых типах данных
      - бинд переменная типа blob
    code: |
      declare
        v_str blob := utl_raw.cast_to_raw('test_value');
      begin
        select v_str into:res
        from dual;
      end;
    input: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "blob",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "blob",
            "value": null
          }
        ],
        "test": true
      }
    result: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "blob",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "blob",
            "value": "746573745F76616C7565"
          }
        ]
      }
    comment: ''
