      caption: Проверка операторов or, and и not на большом сложном примере с разными приоритетами, скобками, значения заданы определёнными значениями и пустыми значениями, выражения заданы bool-переменными
      code: |-
        declare
          bl1 boolean := true;
          bl2 boolean := false;
          bl3 boolean := null;
          bl4 boolean := true;
        begin
          if not ((bl1 and (not bl2 or bl3))
          or (not ((bl1 or bl3) and (not (bl1 and bl4))))
          and ((bl3 or bl1) and not (bl2 and not bl4))
