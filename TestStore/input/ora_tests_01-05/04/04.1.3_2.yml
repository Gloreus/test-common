    - id: 31
      caption: "Сравнение результата вычислений и числа (проверка сравнения суммы вещественных чисел с целым)"
      code: |
        declare
          n1 number := 1.5;
          n2 number := 0.5;
          n3 number := 2;
          res boolean;
        begin
          res := n1 + n2 = n3;
          if res then
            :res := 'TRUE';
          else
            :res := 'FALSE';
          end if;
        end;
      input: '{"resultType":"binds","inputBinds":[{"name":"res","type":"varchar2"}],"outputBinds":[{"name":"res","type":"varchar2","value":"TRUE"}]}'
      result: '{"resultType":"binds","inputBinds":[{"name":"res","type":"varchar2"}],"outputBinds":[{"name":"res","type":"varchar2","value":"TRUE"}]}'
      comment: ''

