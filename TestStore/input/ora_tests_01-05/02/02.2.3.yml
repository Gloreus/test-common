  cases:
  - id: 1
    caption: Проверка корректности использования бинд-переменных в базовых типах данных
      - бинд переменная типа interval
    code: |-
      declare
       v_result interval day(2) to second(0) := interval '10 05:30:00' day to second;
      begin
       select v_result into :res from dual;
      end;
    input: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "test": true
      }
    result: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": "+000000010 05:30:00.000000000"
          }
        ]
      }
    comment: ''
