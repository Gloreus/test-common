server:
  port: ${PORT:8080}

logging:
  level:
    org.atmosphere: warn
    ru.sqbt.plsqltests.manager: debug

vaadin:
  launch-browser: true
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,ru.sqbt.plaqltests

spring:
  jpa:
    hibernate:
      ddl-auto: update

teststore:
  root-dir: "TestStore"
  cases-dir: "cases"
  profiles-dir: "profiles"
  ora-tests-dir: "input"
