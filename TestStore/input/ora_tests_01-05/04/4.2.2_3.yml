      caption: "Проверка полной записи оператора в поисковой форме, в котором есть несколько when и else (входящий параметр такой, что значение попадает в группу else, Case возвращает значения, определённые в переменных)"
      code: |
        declare
          str1 varchar2(200) := 'when 1';
          str2 varchar2(200) := 'when 2';
          str3 varchar2(200) := 'else';
        begin
          :res := case
            when :num < 5 then str1
            when :num < 15 then str2
            else str3
          end;
        end;
