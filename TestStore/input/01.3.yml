    - id: 8
      caption: Без объявления переменных. У дочернего блока кода есть блок с перехватом ошибок, в теле дочернего блока кода выполняется операция с ошибкой (деление на 0), инициализация происходит из обработчика исключения дочернего блока. У родительского блока также есть обработчик исключения, который не задействуется.
      code: |
        BEGIN
          :n := 1;
          BEGIN
            :n := :n + 1 / 0;
          EXCEPTION
            WHEN OTHERS THEN
              :n := 2;
          END;
        EXCEPTION
          WHEN OTHERS THEN
            :n := 3;
        END;
      input: |-
        {
          "resultType": "binds",
          "inputBinds": [
            {
              "name": "n",
              "type": "number",
              "value": 1
            }
          ],
          "outputBinds": [
            {
              "name": "n",
              "type": "number",
              "value": 2
            }
          ]
        }
      result: |-
        {
          "resultType": "binds",
          "inputBinds": [
            {
              "name": "n",
              "type": "number",
              "value": 2
            }
          ],
          "outputBinds": [
