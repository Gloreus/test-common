    - id: 6
      caption: Без объявления переменных. У дочернего блока кода есть блок с перехватом ошибок (часть из блока исключений не выполняется, значение переменной присваивается корректно)
      code: |
        BEGIN
          :n := 1;
          BEGIN
            :n := :n + 1;
          EXCEPTION
            WHEN OTHERS THEN
              :n := 3;
          END;
        END;
      input: |-
