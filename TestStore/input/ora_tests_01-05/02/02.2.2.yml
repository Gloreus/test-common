    caption: Проверка корректности использования бинд-переменных в базовых типах данных
      - бинд переменная типа varchar2
    code: |-
      declare
       v_str varchar2(100) := 'test_value';
      begin
       select v_str into :res from dual;
      end;
    input: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "test": true
      }
    result: |-
      {
        "resultType": "binds",
        "inputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": null
          }
        ],
        "outputBinds": [
          {
            "name": "res",
            "type": "varchar2",
            "value": "test_value"
          }
        ]
      }
    comment: ''
